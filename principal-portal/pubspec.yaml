name: principal_portal
description: "KSRCE ERP - Principal Portal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  fl_chart: ^0.69.2
  intl: ^0.19.0
  data_table_2: ^2.5.15
  collection: ^1.19.0
  # Browser APIs for the CSV download; the portal is web-only.
  web: ^1.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  # Inter, bundled rather than fetched from fonts.gstatic.com at runtime.
  # SIL Open Font License 1.1 — the licence text ships beside the files in
  # assets/fonts/OFL.txt, which the OFL requires to be distributed with them.
  #
  # Only the weights the portal renders (400/500/600/700). No italics: nothing
  # in lib/ asks for one. Adding a weight here without adding the file makes
  # Flutter synthesise it silently, so keep the two in step.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
