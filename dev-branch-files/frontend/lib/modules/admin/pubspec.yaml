name: admin_module
description: "Admin Module for Unified College Academic Management System (CAMS) ERP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0-0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and Material Design
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  flutter_localizations:
    sdk: flutter

  # File Management
  file_picker: ^5.3.0

  # Routing and Navigation
  go_router: ^17.3.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Charts and Data Visualization
  fl_chart: ^1.2.0

  # Localization
  intl: ^0.20.2

  # HTTP Client
  http: ^1.2.0

  # Date/Time Pickers
  month_year_picker: ^0.5.0+1

  # Loading Animation
  loading_animation_widget: ^1.3.0

  # Environment Configuration
  flutter_dotenv: ^5.2.1

  # Firebase Integration
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.9

  # Supabase Integration
  supabase_flutter: ^2.6.0

  # Database
  postgres: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

# Admin Module Specific Configuration
# This module requires the following from the main app:
# - Shared widgets from shared/widgets/
# - Shared services from shared/services/
# - Configuration from core/firebase_options.dart
# - Router configuration from app/router.dart
